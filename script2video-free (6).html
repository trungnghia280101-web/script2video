<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Script2Video Free</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1{grid-column:1/-1;margin:0;font-size:22px}h1 small{display:block;color:var(--mu);font-size:14px;font-weight:400}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card{margin-top:10px}
textarea,input,select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}

</style></head><body><main>
<h1>🎬 Script2Video<small>Dán kịch bản, tách thành cảnh, thêm ảnh, xem trước và xuất video ngay trên trình duyệt.</small></h1>

  </div>
  <input id="mode" type="hidden" value="draw"><input id="key" type="hidden"><input id="style" type="hidden">
  <div class="row"><div><label>Giọng đọc tiếng Việt</label><select id="voice"></select></div><div><label>Tốc độ đọc</label><select id="rate"><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option></select></div><div><label>Cao độ giọng</label><select id="pitch"><option value="1">Bình thường</option><option value="1.15">Cao hơn (nữ tính hơn)</option><option value="1.3">Rất cao</option></select></div></div>

 </div>
 <div id="list"></div>
</section>
<section class="box" style="align-self:start">

 <button id="prev">▶ Xem trước</button><button id="rec">⏺ Xuất video</button><button id="stp" class="g">Dừng</button>
 <div id="status"></div>
 <video id="out" controls hidden></video>
 <a id="dl" download="video.webm" hidden><button class="g">⬇ Tải video (.webm)</button></a>
 <audio id="bgm" loop></audio>
</section>
</main>

const isM=n=>/namminh|nam minh|\bnam\b|\bmale\b(?!.*female)/i.test(n),isF=n=>/hoaimy|hoai my|hoài my|\ban\b|linh|female|nữ|google/i.test(n)&&!isM(n);
function loadVoices(){
 voices=speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
 const sel=$('#voice');sel.innerHTML='';
 if(!voices.length){const o=document.createElement('option');o.value='';o.textContent='Chưa có giọng tiếng Việt: hãy dùng Microsoft Edge hoặc cài giọng Vietnamese trong Cài đặt Windows > Giọng nói';sel.appendChild(o);return}
 [...voices].sort((x,y)=>isF(y.name)-isF(x.name)).forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+(isF(v.name)?' – giọng nữ':isM(v.name)?' – giọng nam':'');sel.appendChild(o)});
 const best=voices.find(v=>isF(v.name)&&/natural|online/i.test(v.name))||voices.find(v=>isF(v.name))||voices.find(v=>!isM(v.name))||voices[0];
 sel.value=best.name;if(!isF(best.name))$('#pitch').value='1.3';
}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
const speak=s=>new Promise(res=>{const u=new SpeechSynthesisUtterance(s.text),v=voices.find(x=>x.name===$('#voice').value);if(v){u.voice=v;u.lang=v.lang}else u.lang='vi-VN';u.rate=+$('#rate').value;u.pitch=+$('#pitch').value;const to=setTimeout(res,Math.max(s.dur*3000,10000));u.onend=u.onerror=()=>{clearTimeout(to);res()};speechSynthesis.speak(u)});
function stop(){run++;cancelAnimationFrame(raf);speechSynthesis.cancel();bgm.pause();if(mr&&mr.state!=='inactive')mr.stop();mr=null;if(disp){disp.getTracks().forEach(t=>t.stop());disp=null}}
async function play(rec){
 if(!scenes.length)return;stop();const my=run,useTts=$('#tts').checked;
 $('#status').textContent='';
 if(rec){
  let st;try{st=cv.captureStream(30)}catch(e){$('#status').textContent='Trình duyệt không cho ghi canvas.';return}
  if(useTts){try{disp=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,preferCurrentTab:true});
   if(!disp.getAudioTracks().length){$('#status').textContent='Bạn chưa bật Chia sẻ âm thanh tab. Hãy thử lại và tick ô âm thanh.';stop();return}
   disp.getAudioTracks().forEach(t=>st.addTrack(t))}catch(e){$('#status').textContent='Cần cho phép chia sẻ tab hiện tại (kèm âm thanh) để ghi giọng đọc.';return}}
  if(bgm.src){try{ac=ac||new AudioContext();ac.resume();if(!dest){dest=ac.createMediaStreamDestination();const n=ac.createMediaElementSource(bgm);n.connect(dest);n.connect(ac.destination)}dest.stream.getAudioTracks().forEach(t=>st.addTrack(t))}catch(e){}}
  const chunks=[],mt=['video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:5e6});
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{const u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));const v=$('#out');v.src=u;v.hidden=false;$('#dl').href=u;$('#dl').hidden=false;$('#status').textContent='Xuất xong! Kéo xuống để xem và tải video.'};
  mr.start();
 }
 if(bgm.src){bgm.currentTime=0;bgm.play().catch(()=>{})}
 const loop=()=>{draw(cur,(performance.now()-t0)/1000);raf=requestAnimationFrame(loop)};
 for(let i=0;i<scenes.length;i++){
  if(my!==run)return;cur=i;t0=performance.now();cancelAnimationFrame(raf);loop();
  $('#status').textContent=(rec?'Đang xuất':'Đang phát')+' cảnh '+(i+1)+'/'+scenes.length;
  await Promise.all([useTts&&!scenes[i].mute?speak(scenes[i]):wait(scenes[i].dur*1000),wait(2500)]);
  await wait(i===scenes.length-1?1200:350);
 }
 if(my!==run)return;
 const m=mr,sm=$('#status');stop();if(m&&m.state!=='inactive'){}else if(!rec)sm.textContent='Xem trước xong.';
}
let tmr=0;$('#script').oninput=()=>{clearTimeout(tmr);tmr=setTimeout(parse,700)};$('#test').onclick=()=>{speechSynthesis.cancel();speak({text:'Xin chào các con! Cô là giáo viên của các con đây.',dur:3})};$('#parse').onclick=parse;$('#prev').onclick=()=>play(false);$('#rec').onclick=()=>play(true);$('#stp').onclick=()=>{stop();$('#status').textContent='Đã dừng.'};
$('#ar').onchange=()=>{const[w,h]=sizes[$('#ar').value];cv.width=w;cv.height=h;scenes.forEach(s=>{if(s.drawn)s.img=illustrate(s)});draw(cur,9)};
$('#mus').onchange=e=>{const f=e.target.files[0];if(f)bgm.src=URL.createObjectURL(f)};
parse();
</script></body></html>
